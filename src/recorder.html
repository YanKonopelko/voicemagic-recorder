<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' data:; style-src 'unsafe-inline'; worker-src data:; media-src blob:; connect-src data:; base-uri 'none'; form-action 'none'">
<title>VoiceMagic · Voice recorder</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#10131e;color:#eef0ff}*{box-sizing:border-box}body{max-width:920px;margin:32px auto;padding:0 22px 40px}h1{font-size:clamp(28px,5vw,40px);line-height:1.15;letter-spacing:-1px;margin:12px 0}h2{font-size:21px;margin:0 0 12px}p{color:#bcc6df;margin:12px 0}.card{background:#1b2133;border:1px solid #34415d;border-radius:16px;padding:24px;margin:20px 0}.row{display:flex;gap:16px;flex-wrap:wrap}.row>label{flex:1;min-width:min(220px,100%)}label{display:block;color:#d0d8ee;font-size:14px;margin:12px 0}input:not([type=checkbox]),select{display:block;background:#111727;border:1px solid #64718e;border-radius:8px;color:white;padding:11px;width:100%;margin-top:6px;font:inherit}button{background:#c4afff;border:0;border-radius:9px;padding:12px 18px;font:600 15px system-ui;color:#201738;cursor:pointer;margin:6px 8px 6px 0;min-height:44px}button.secondary{background:#34415d;color:white}button.danger{background:#603743;color:#ffe5e8}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #e3d6ff;outline-offset:3px}#prompt{font-size:clamp(25px,4vw,34px);line-height:1.45;color:white;overflow-wrap:anywhere;margin:12px 0}#pronunciation{font-size:19px;color:#dbcaff}#ipa{font-size:16px;color:#b9c8e3}#status{color:#d0bbff;min-height:28px}audio{width:100%;margin:16px 0}small{color:#b2bfdc}#error{color:#ffb4ba;white-space:pre-wrap}.badge{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#d2c0ff}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header label{margin:0;min-width:180px}details>summary{cursor:pointer;font-weight:600}table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;border-bottom:1px solid #34415d;padding:8px}.scroll{overflow-x:auto}#storage-status{padding:12px 16px;border-left:3px solid #a3dac0;background:#172a29}#storage-status.warning{border-color:#f2c078;background:#342d24}#level{width:100%;height:14px;accent-color:#a3dac0}[hidden]{display:none!important}.actions{margin-top:12px}.notice,.footer{font-size:14px}.check{display:flex;gap:10px;align-items:flex-start}.check input{margin-top:5px;flex-shrink:0}#counter{display:block}#take-list{max-width:100%}@media(max-width:520px){body{padding:0 14px 24px;margin-top:20px}.card{padding:18px}th,td{padding:7px 5px}button{padding:12px 14px}}
a{color:#d0bbff} #wizard-step{color:#b2bfdc;font-size:14px} #screen-identity{max-width:600px} #screen-thanks a{font-size:clamp(16px,4vw,24px);overflow-wrap:anywhere}
#spell-preview{max-width:400px;margin:18px 0;border:1px solid #465270;border-radius:12px;overflow:hidden;background:#151c29}#spell-preview figcaption{padding:10px 12px;font-size:13px}#spell-preview-description{display:block;color:#cbb8ff;margin-top:3px}#spell-preview-video{display:block;width:100%;height:auto;aspect-ratio:16/9}#spell-preview-note{display:block;padding:9px 12px;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<header><div class="badge">VoiceMagic · <span data-i18n="sharedModel"></span></div><span id="wizard-step" aria-live="polite"></span></header>
<h1 data-i18n="title"></h1>
<main>
<section id="screen-identity" class="card"><h2 data-i18n="wizardIdentity"></h2>
<label><span data-i18n="interfaceLanguage"></span><select id="ui-language"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="nb">Norsk (bokmål)</option></select></label>
<label><span data-i18n="speakerLabel"></span><input id="speaker" autocomplete="off" maxlength="80" spellcheck="false"></label><small data-i18n="identityHelp"></small><div class="actions"><button id="wizard-continue" data-i18n="next"></button></div></section>
<section id="screen-intro" class="card" hidden><h2 data-i18n="wizardAbout"></h2><p data-i18n="wizardProject"></p><p data-i18n="wizardInstructions"></p>
<label><span data-i18n="nativeLanguage"></span><input id="language" maxlength="100" data-placeholder="languagePlaceholder"></label>
<label><span data-i18n="environmentLabel"></span><input id="environment" maxlength="500" data-placeholder="environmentPlaceholder"></label>
<label class="check"><input type="checkbox" id="consent"><span data-i18n="consent"></span></label>
<button id="wizard-back" class="secondary" data-i18n="previous"></button><button id="wizard-start" data-i18n="wizardStart"></button></section>
<div id="screen-recording" hidden><section class="card" aria-labelledby="task-title"><h2 id="task-title" data-i18n="wizardRecord"></h2><div class="row" hidden><label><span data-i18n="taskSet"></span><select id="group"><option value="words" data-i18n="wordsGroup"></option><option value="chains" data-i18n="chainsGroup"></option><option value="speech" data-i18n="speechGroup"></option><option value="noise" data-i18n="noiseGroup"></option></select></label><label id="pace-label" hidden><span data-i18n="paceLabel"></span><select id="pace"><option value="normal" data-i18n="normalPace"></option><option value="joined" data-i18n="joinedPace"></option></select></label><label id="duration-label" hidden><span data-i18n="durationLabel"></span><select id="duration"><option value="60">60 s</option><option value="90">90 s</option><option value="120">120 s</option></select></label></div><small id="counter"></small><div id="prompt"></div><div id="pronunciation"></div><div id="ipa"></div><p id="hint"></p><figure id="spell-preview" hidden><figcaption><b id="spell-preview-title"></b><span id="spell-preview-description"></span></figcaption><video id="spell-preview-video" muted loop playsinline controls preload="metadata" width="480" height="270"></video><small id="spell-preview-note"></small></figure><div id="status" role="status" aria-live="polite"></div><meter id="level" min="0" max="1" value="0" data-aria="levelLabel"></meter><div class="actions"><button id="record" data-i18n="record"></button><button id="stop" class="secondary" disabled data-i18n="stop"></button></div><div id="review" hidden><p data-i18n="inlineReview"></p><audio id="playback" hidden preload="metadata" data-aria="playbackLabel"></audio><button id="replay" class="secondary" data-i18n="replay" disabled></button><button id="verify" data-i18n="inlineConfirm" disabled></button><button id="exclude" class="secondary" data-i18n="inlineCancel" disabled></button></div><button id="previous" class="secondary" data-i18n="previous"></button><button id="next" class="secondary" data-i18n="next"></button></section><details class="card" id="guide"><summary data-i18n="guideTitle"></summary><p data-i18n="pronunciationGuide"></p><p data-i18n="cancelGuide"></p><div class="scroll"><table><thead><tr><th data-i18n="rune"></th><th data-i18n="say"></th><th>IPA</th></tr></thead><tbody id="rune-table"></tbody></table></div><p class="notice" data-i18n="ipaGuide"></p></details>

<button id="wizard-back-intro" class="secondary" data-i18n="wizardAbout"></button><button id="backup" class="secondary" data-i18n="download"></button></div>
<section id="screen-thanks" class="card" hidden><h2 data-i18n="wizardThanks"></h2><p data-i18n="wizardThankYou"></p><p data-i18n="wizardSend"></p><p><a href="mailto:konopelkoyan@gmail.com">konopelkoyan@gmail.com</a></p><button id="download" disabled data-i18n="download"></button><p data-i18n="wizardAttach"></p><button id="wizard-back-recordings" class="secondary" data-i18n="wizardReturn"></button></section>
</main><div hidden aria-hidden="true"><b id="summary"></b><select id="take-list"></select><p id="take-details"></p><select id="kind"><option value="command">command</option><option value="speech">speech</option><option value="noise">noise</option></select><input id="transcript"><div id="transcript-buttons"></div><button id="delete-take"></button><button id="clear"></button></div><p id="storage-status" role="status"></p><p id="error" role="alert"></p>
<script src="recorder-locales.js"></script><script src="recorder-preview-videos.js"></script><script src="recorder.js"></script><script src="recorder-preview.js"></script><script src="recorder-wizard.js"></script>
</body></html>
